<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sign in · VFA</title><link rel="stylesheet" href="/static/core/style.css"></head><body class="loginpage"><form method="post" class="loginbox">{% csrf_token %}<div class="brandmark big">V</div><h1>Welcome to VFA</h1><p>Financial intelligence, built for better decisions.</p>{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}<label>Username</label><input name="username" required autofocus><label>Password</label><input type="password" name="password" required><button class="btn primary full">Sign in</button><small>First run? Create an administrator with <code>python manage.py createsuperuser</code>.</small></form></body></html>
