{% extends 'core/base.html' %}{% block heading %}Document repository{% endblock %}{% block content %}<div class="grid two"><div class="panel"><h2>Upload document</h2><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn primary">Upload</button></form></div><div class="panel"><h2>Documents</h2>{% for x in items %}<div class="resultrow"><span>{{ x.title }}<small>{{ x.uploaded_at }}</small></span><a href="{{ x.file.url }}" target="_blank">Open ↗</a></div>{% empty %}<p class="hint">No documents uploaded.</p>{% endfor %}</div></div>{% endblock %}
