{% extends 'core/base.html' %}{% block heading %}Financial research{% endblock %}{% block content %}<div class="grid two"><div class="panel"><h2>Save research note</h2><form method="post">{% csrf_token %}<label>Title</label><input name="title" required><label>Analysis / commentary</label><textarea name="body" rows="8"></textarea><button class="btn primary">Save note</button></form></div><div class="panel"><h2>Research library</h2>{% for r in reports %}<article class="note"><b>{{ r.title }}</b><small>{{ r.created_at }}</small><p>{{ r.summary }}</p></article>{% empty %}<p class="hint">No research notes saved.</p>{% endfor %}</div></div>{% endblock %}
